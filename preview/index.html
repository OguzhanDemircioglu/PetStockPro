<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; font-family: Verdana, Geneva, Tahoma, sans-serif; }
  #root { height: 100vh; }

  /* Splash header above canvas */
  .splash {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 12px 22px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(0,0,0,.08);
    display: flex; align-items: center; gap: 14px;
  }
  .splash .logo {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #d4621c, #1e3a5f);
    color: #fff; font-weight: bold;
    display: grid; place-items: center;
    box-shadow: 0 8px 22px rgba(212,98,28,.32);
    flex-shrink: 0;
  }
  .splash .title { font-size: 16px; font-weight: bold; color: #1e3a5f; letter-spacing: -.3px; }
  .splash .sub { font-size: 11.5px; color: #5b6a82; }
  .splash .pill {
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: bold;
    background: #fdf3ec; color: #9c4710;
  }
  .splash .pill.green { background: #ecfdf5; color: #15803d; }
  .splash .spacer { flex: 1; }
  .splash a {
    font-size: 12px;
    color: #1e3a5f;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid rgba(0,0,0,.1);
    background: #fff;
    transition: all .15s ease;
  }
  .splash a:hover { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }

  /* Canvas offset for splash */
  #root > div:first-child { padding-top: 64px; }

  /* Iframe artboards */
  iframe.screen-frame {
    width: 100%; height: 100%;
    border: 0;
    border-radius: 6px;
    background: #f6f7fb;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
