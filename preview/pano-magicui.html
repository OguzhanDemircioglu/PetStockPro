<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useRef, useMemo, useCallback, forwardRef } = React;
const { motion, AnimatePresence, useMotionValue, useMotionTemplate, useSpring, useInView } = window.Motion || window.framerMotion || {};

// ===========================================================================
// cn — class concat utility
// ===========================================================================
const cn = (...classes) => classes.filter(Boolean).join(' ');

// ===========================================================================
// MagicCard — spotlight hover (magicui adapted)
// ===========================================================================
function MagicCard({
  children, className,
  gradientSize = 200,
  gradientColor = '#1a5588',
  gradientOpacity = 0.12,
  gradientFrom = '#d44a14',
  gradientTo   = '#1a5588',
}) {
  const mouseX = useMotionValue(-gradientSize);
  const mouseY = useMotionValue(-gradientSize);

  const handleMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    mouseX.set(e.clientX - rect.left);
    mouseY.set(e.clientY - rect.top);
  };
  const reset = () => { mouseX.set(-gradientSize); mouseY.set(-gradientSize); };

  const borderBg = useMotionTemplate`
    linear-gradient(var(--color-background) 0 0) padding-box,
    radial-gradient(${gradientSize}px circle at ${mouseX}px ${mouseY}px,
      ${gradientFrom}, ${gradientTo}, var(--color-border) 100%) border-box
  `;

  const spotBg = useMotionTemplate`
    radial-gradient(${gradientSize}px circle at ${mouseX}px ${mouseY}px,
      ${gradientColor}, transparent 100%)
  `;

  return (
    <motion.div
      onPointerMove={handleMove}
      onPointerLeave={reset}
      className={cn('group relative isolate overflow-hidden rounded-[inherit] border border-transparent', className)}
      style={{ background: borderBg }}
    >
      <div className="absolute inset-px z-20 rounded-[inherit] bg-white" />
      <motion.div
        className="pointer-events-none absolute inset-px z-30 rounded-[inherit] opacity-0 transition-opacity duration-300 group-hover:opacity-100"
        style={{ background: spotBg, opacity: gradientOpacity }}
      />
      <div className="relative z-40">{children}</div>
    </motion.div>
  );
}

// ===========================================================================
// NumberTicker — count-up
// ===========================================================================
function NumberTicker({ value, startValue = 0, direction = 'up', delay = 0, className, decimalPlaces = 0, suffix = '', prefix = '' }) {
  const ref = useRef(null);
  const motionValue = useMotionValue(direction === 'down' ? value : startValue);
  const springValue = useSpring(motionValue, { damping: 60, stiffness: 100 });
  const isInView = useInView(ref, { once: true, margin: '0px' });

  useEffect(() => {
    if (!isInView) return;
    const t = setTimeout(() => {
      motionValue.set(direction === 'down' ? startValue : value);
    }, delay * 1000);
    return () => clearTimeout(t);
  }, [isInView, motionValue, delay, value, direction, startValue]);

  useEffect(() => {
    return springValue.on('change', (latest) => {
      if (!ref.current) return;
      const formatted = Intl.NumberFormat('tr-TR', {
        minimumFractionDigits: decimalPlaces,
        maximumFractionDigits: decimalPlaces,
      }).format(Number(latest.toFixed(decimalPlaces)));
      ref.current.textContent = prefix + formatted + suffix;
    });
  }, [springValue, decimalPlaces, prefix, suffix]);

  return <span ref={ref} className={cn('inline-block tabular-nums', className)}>{prefix}{startValue}{suffix}</span>;
}

// ===========================================================================
// ShimmerButton — perimeter shimmer
// ===========================================================================
function ShimmerButton({
  children, className, onClick,
  shimmerColor = '#ffffff',
  shimmerSize  = '0.05em',
  shimmerDuration = '3s',
  borderRadius = '12px',
  background = '#ffffff',
  textColor  = '#d44a14',
  ...props
}) {
  const style = {
    '--spread': '90deg',
    '--shimmer-color': shimmerColor,
    '--radius': borderRadius,
    '--speed': shimmerDuration,
    '--cut': shimmerSize,
    '--bg': background,
    color: textColor,
    borderRadius,
    background,
  };
  return (
    <button
      onClick={onClick}
      style={style}
      className={cn(
        'group relative z-0 inline-flex cursor-pointer items-center justify-center overflow-hidden border border-white/10 px-5 py-2.5 whitespace-nowrap font-bold text-sm',
        'transform-gpu transition-transform duration-300 ease-in-out active:translate-y-px',
        className
      )}
      {...props}
    >
      <div className="absolute inset-0 overflow-visible blur-[2px] -z-30" style={{ containerType: 'size' }}>
        <div className="absolute inset-0 animate-shimmer-slide" style={{ aspectRatio: '1', height: '100%' }}>
          <div
            className="absolute -inset-full w-auto animate-spin-around"
            style={{
              background: `conic-gradient(from calc(270deg - (90deg * 0.5)), transparent 0, ${shimmerColor} 90deg, transparent 90deg)`,
            }}
          />
        </div>
      </div>
      <span className="relative z-10 inline-flex items-center gap-2">{children}</span>
      <div className="absolute inset-0 rounded-[inherit] shadow-[inset_0_-6px_10px_#ffffff1f] group-hover:shadow-[inset_0_-8px_12px_#ffffff3f] transition-shadow duration-300" />
      <div className="absolute inset-[0.05em] -z-20 rounded-[inherit]" style={{ background }} />
    </button>
  );
}

// ===========================================================================
// BorderBeam — animated beam along border (simplified for v3)
// ===========================================================================
function BorderBeam({ size = 80, duration = 6, delay = 0, colorFrom = '#ffaa40', colorTo = '#d44a14', reverse = false, borderWidth = 1, className }) {
  return (
    <div
      className="pointer-events-none absolute inset-0 rounded-[inherit] overflow-hidden"
      style={{ borderWidth: `${borderWidth}px`, borderColor: 'transparent' }}
    >
      <motion.div
        className={cn('absolute', className)}
        style={{
          width: size,
          height: size,
          offsetPath: `rect(0 auto auto 0 round ${size}px)`,
          background: `linear-gradient(to left, ${colorFrom}, ${colorTo}, transparent)`,
          borderRadius: size,
        }}
        initial={{ offsetDistance: '0%' }}
        animate={{ offsetDistance: reverse ? ['100%', '0%'] : ['0%', '100%'] }}
        transition={{ repeat: Infinity, ease: 'linear', duration, delay: -delay }}
      />
    </div>
  );
}

// ===========================================================================
// AnimatedList — items appear one-by-one
// ===========================================================================
function AnimatedListItem({ children }) {
  return (
    <motion.div
      initial={{ scale: 0.95, opacity: 0, y: 12 }}
      animate={{ scale: 1, opacity: 1, y: 0 }}
      exit={{ scale: 0.95, opacity: 0 }}
      transition={{ type: 'spring', stiffness: 280, damping: 30 }}
      layout
      className="w-full"
    >
      {children}
    </motion.div>
  );
}
function AnimatedList({ children, className, delay = 600 }) {
  const [index, setIndex] = useState(0);
  const arr = useMemo(() => React.Children.toArray(children), [children]);
  useEffect(() => {
    if (index >= arr.length - 1) return;
    const t = setTimeout(() => setIndex(i => i + 1), delay);
    return () => clearTimeout(t);
  }, [index, arr.length, delay]);
  const shown = arr.slice(0, index + 1);
  return (
    <div className={cn('flex flex-col gap-2.5', className)}>
      <AnimatePresence>
        {shown.map(item => (
          <AnimatedListItem key={item.key}>{item}</AnimatedListItem>
        ))}
      </AnimatePresence>
    </div>
  );
}

// ===========================================================================
// PulsatingButton — attention-grab
// ===========================================================================
function PulsatingButton({ children, className, pulseColor = 'rgba(196,69,58,.45)', duration = '1.6s', ...props }) {
  return (
    <button
      className={cn('relative inline-flex items-center justify-center rounded-xl px-4 py-2.5 font-bold text-sm text-white cursor-pointer', className)}
      style={{ '--pulse-color': pulseColor, '--duration': duration }}
      {...props}
    >
      <span className="relative z-10 inline-flex items-center gap-2">{children}</span>
      <span aria-hidden="true" className="pointer-events-none absolute inset-0 rounded-[inherit] animate-pulse-soft" />
    </button>
  );
}

// ===========================================================================
// Meteors — meteor shower background
// ===========================================================================
function Meteors({ number = 12 }) {
  const meteors = new Array(number).fill(0);
  return (
    <>
      {meteors.map((_, i) => (
        <span
          key={i}
          className="pointer-events-none absolute h-0.5 w-0.5 rounded-full bg-white shadow-[0_0_0_1px_#ffffff10] rotate-[215deg] animate-meteor"
          style={{
            top: -2,
            left: Math.floor(Math.random() * 100) + '%',
            animationDelay: (Math.random() * 1.6).toFixed(2) + 's',
            animationDuration: (Math.random() * 4 + 4).toFixed(2) + 's',
          }}
        >
          <span className="absolute top-1/2 -translate-y-1/2 h-px w-[60px] bg-gradient-to-r from-white to-transparent" />
        </span>
      ))}
    </>
  );
}

// ===========================================================================
// DotPattern — subtle bg dots
// ===========================================================================
function DotPattern({ className }) {
  return (
    <svg className={cn('pointer-events-none absolute inset-0 h-full w-full', className)} aria-hidden="true">

}

// ===========================================================================
// AnimatedShinyText — shimmer text

  const badgeCls = {
    cart:   'bg-cart text-white',
    danger: 'bg-danger text-white',
    bars:   'bg-bars-7 text-white',
  }[badgeTone];
  return (
    <a href="#" className={cn(base, state)}>
      <svg viewBox="0 0 24 24" className="w-[18px] h-[18px] shrink-0" fill="none" stroke="currentColor" strokeWidth="2">
